# Promote the five per-host archives staged at the `embedder-staging`
# pre-release into a real `v<version>` release.
#
# Upstream gathered the binaries from a separate `pre-releases` repository
# using xbb-helper's download-all-binaries.sh. That script hardcodes the
# xpack-dev-tools URL, so this workflow stages within this same repository
# and gathers with `gh release download` instead.
#
# The release is created as a DRAFT on purpose. Embedder downloads these
# assets anonymously at runtime, and a draft's assets are not publicly
# readable -- publishing is the deliberate act that makes a build live.

name: 'Publish the Embedder OpenOCD release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version, e.g. 0.12.0-8 (blank reads build-assets/scripts/VERSION)'
        required: false
        type: string
        default: ''

jobs:
  create-release:
    name: 'Publish the release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: 'Resolve version'
        id: version
        run: |
          version='${{github.event.inputs.version}}'
          if [ -z "${version}" ]
          then
            version="$(cat build-assets/scripts/VERSION)"
          fi
          echo "Releasing version ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: 'Gather the staged binaries'
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          mkdir -pv ~/binaries
          gh release download embedder-staging \
            --repo "${GITHUB_REPOSITORY}" \
            --dir ~/binaries \
            --pattern '*'
          ls -l ~/binaries

      - name: 'Verify all five hosts are present and intact'
        run: |
          cd ~/binaries
          version='${{steps.version.outputs.version}}'
          expected=(
            "embedder-openocd-${version}-darwin-arm64.tar.gz"
            "embedder-openocd-${version}-darwin-x64.tar.gz"
            "embedder-openocd-${version}-linux-arm64.tar.gz"
            "embedder-openocd-${version}-linux-x64.tar.gz"
            "embedder-openocd-${version}-win32-x64.zip"
          )
          missing=0
          for name in "${expected[@]}"
          do
            if [ ! -f "${name}" ]
            then
              echo "MISSING: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" != "0" ]
          then
            echo "Refusing to publish a partial release."
            echo "Dispatch the missing build-<host>.yml workflow and re-run."
            exit 1
          fi
          # The build writes a .sha next to each archive; a mismatch here means
          # a truncated upload, which would otherwise reach users as a checksum
          # failure at install time.
          for sha in *.sha
          do
            echo "Checking ${sha}"
            sha256sum -c "${sha}"
          done
          echo
          echo "The sha256 values below go into the Embedder manifest:"
          cat *.sha

      - name: 'Create body'
        run: |
          npm --prefix build-assets install -dd
          ./build-assets/node_modules/.bin/liquidjs \
            --context '{ "releaseVersion": "${{steps.version.outputs.version}}" }' \
            --template @build-assets/templates/body-github-release-liquid.md \
            --output .github/workflows/body-github-release.md
          cat .github/workflows/body-github-release.md

      - name: 'Publish draft release'
        # https://github.com/ncipollo/release-action
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: '~/binaries/*'
          bodyFile: '.github/workflows/body-github-release.md'
          commit: 'embedder/mainline'
          draft: true
          name: 'Embedder OpenOCD v${{steps.version.outputs.version}}'
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          prerelease: false
          replacesArtifacts: true
          tag: 'v${{steps.version.outputs.version}}'
          token: ${{secrets.GITHUB_TOKEN}}

      - name: 'Next steps'
        run: |
          echo "Draft release v${{steps.version.outputs.version}} created."
          echo
          echo "Its assets are NOT publicly downloadable until the release is"
          echo "published. Before publishing:"
          echo "  1. Check each archive's bin/openocd --version reports the"
          echo "     expected upstream commit."
          echo "  2. Update the Embedder manifest, install.sh and install.ps1"
          echo "     with the sha256 values printed above."
          echo "  3. Publish the release, then verify one anonymous download."
